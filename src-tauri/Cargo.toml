[package]
name = "hermes"
version = "0.1.0"
description = "Local-first desktop client for Hermes Agent"
authors = ["Hermes Contributors"]
edition = "2021"

[lib]
name = "hermes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
flate2 = "1.1.9"
getrandom = "0.4.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tar = "0.4.46"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-opener = "2.5.4"
