[package]
name = "hermes"
version = "0.1.0"
description = "Local-first desktop client for Hermes Agent"
authors = ["Hermes Contributors"]
edition = "2021"

[lib]
name = "hermes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
